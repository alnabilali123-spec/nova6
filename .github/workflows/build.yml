name: Build NovaTube Debug APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch / tag to build (optional)'
        required: false
        default: ''

jobs:
  build:
    name: Build (assembleDebug)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3 (for the yt-dlp binary download)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/.tmp
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode Android signing keystore (optional)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
            echo "KEYSTORE_FILE=keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: List APK artifacts
        run: |
          echo "--- APK output ---"
          ls -lah app/build/outputs/apk/debug/ || true
          find . -path ./node_modules -prune -o -name '*.apk' -print -exec ls -lah {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaTube-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.aab
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: Smoke compile
    runs-on: ubuntu-latest
    needs: build
    if: success()
    steps:
      - name: Reuse APK
        uses: actions/download-artifact@v4
        with:
          name: NovaTube-debug
          path: apk
      - name: Verify APK contents
        run: |
          set -e
          ls -lah apk/
          $ANDROID_HOME/build-tools/*/aapt dump badging apk/*.apk | head -n 30
